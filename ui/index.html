<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'"><title>Chatterbox</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="mark">C</div><div><strong>Chatterbox</strong><small id="status">Connecting to WhatsApp…</small></div><nav><button id="reload">Reload</button><button id="updates">Check for updates</button><button id="settings">Settings</button></nav></header><aside><div class="sidebar-title">YOUR ACCOUNTS</div><div id="accounts" role="group" aria-label="WhatsApp accounts"></div><button id="add-account" class="add">+ Add account</button><button id="rename-account" class="quiet">Rename selected account</button><form id="account-form" hidden><label for="account-name" id="name-label">Account name</label><input id="account-name" maxlength="40" required autocomplete="off" placeholder="e.g. Work"><div class="form-buttons"><button type="submit" id="account-save">Add</button><button type="button" id="account-cancel">Cancel</button></div></form><p id="account-error" role="status"></p><p class="account-help">Add a number, then scan its QR code using WhatsApp’s Linked devices.</p></aside><script src="app.js"></script></body></html>
